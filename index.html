<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Clutch é a rede social dos skatistas: encontre spots, marque sessões com a sua crew e vista a cultura street."
    />

    <!-- Prévia do link ao compartilhar (WhatsApp, Instagram, X, Discord...).
         __SITE_URL__ é trocado pelo endereço do site na hora do build (veja vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clutch" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Clutch — for those who shred" />
    <meta
      property="og:description"
      content="A rede social dos skatistas: encontre spots, marque sessões com a sua crew e vista a cultura street."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Skatista descendo uma estrada entre montanhas, com o logo do Clutch" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@72,900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Clutch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
